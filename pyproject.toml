[project]
name = "faturama"
version = "0.1.0"
description = "Pipeline auditavel para extracao e consulta de faturas de cartao."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "opendataloader-pdf[hybrid]>=0.1",
    "langchain-opendataloader-pdf>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["faturama"]
ignore_missing_imports = true
