services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: faturama
      POSTGRES_USER: faturama
      POSTGRES_PASSWORD: faturama
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    platform: linux/amd64
    ports:
      - "6432:6432"
    environment:
      - DATABASES_HOST=postgres
      - DATABASES_PORT=5432
      - DATABASES_USER=faturama
      - DATABASES_PASSWORD=faturama
      - DATABASES_DBNAME=faturama
      - PGBOUNCER_LISTEN_ADDR=0.0.0.0
      - PGBOUNCER_LISTEN_PORT=6432
      - PGBOUNCER_AUTH_TYPE=any
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
    depends_on:
      - postgres

  ministack:
    image: ministackorg/ministack:full
    environment:
      AWS_REGION: us-east-1
      DOCKER_NETWORK: "${COMPOSE_PROJECT_NAME:-faturama}_default"
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    image: faturama-worker:local
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment:
      FATURAMA_RUNTIME_ENV: local
      FATURAMA_DB_DSN: postgresql://faturama:faturama@postgres:5432/faturama
      FATURAMA_AWS_REGION: us-east-1
      FATURAMA_AWS_ENDPOINT_URL: http://ministack:4566
      FATURAMA_INPUT_BUCKET: pre-processamento-faturama
      FATURAMA_ARTIFACT_BUCKET: processados-faturama
      FATURAMA_ARTIFACT_PREFIX: processed
      FATURAMA_SIGNED_UPLOAD_EXPIRATION_SECONDS: "300"
    depends_on:
      - postgres
      - ministack
    command: ["--help"]

volumes:
  postgres-data:
