[project]
name = "faturama"
version = "0.1.0"
description = "Pipeline auditavel para extracao e consulta de faturas de cartao."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "langgraph==1.2.6",
    "langgraph-checkpoint-sqlite==3.1.0",
    "opendataloader-pdf[hybrid]==2.4.7",
    "langchain-opendataloader-pdf==2.0.0",
]

[project.scripts]
faturama = "faturama.cli:main"
faturama-worker = "faturama.interface.worker.entrypoint:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
    "mypy==2.1.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["faturama"]
ignore_missing_imports = true
